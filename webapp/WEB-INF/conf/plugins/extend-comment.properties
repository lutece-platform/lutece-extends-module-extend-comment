################################################################################
# Configuration file for Extend plugin

# Set true if a captcha must be used, false otherwise
module.extend.comment.useCaptcha=true
#set false to disable the avatars even if the plugin-avatar is deployed (the plugin-avatar is an optional dependency)
module.extend.comment.avatar.enabled=true
#set true if the avatar key is the lutece user name
module.extend.comment.useLuteceUserNameAsAvatarKey=false

module.extend.comment.commentInfo.itemsPerPage=10
module.extend.comment.userInfo.email=user.business-info.online.email
